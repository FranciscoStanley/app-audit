name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build & Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm test
        env:
          JWT_SECRET: ci-test-secret-with-at-least-32-characters-long
          NODE_ENV: test
      - run: npm run build
        env:
          JWT_SECRET: ci-test-secret-with-at-least-32-characters-long

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./BackEnd
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/app-audit-backend:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/app-audit-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:3000
          tags: |
            ghcr.io/${{ github.repository_owner }}/app-audit-frontend:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/app-audit-frontend:latest

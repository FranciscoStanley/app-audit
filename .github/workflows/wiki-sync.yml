name: Sync Wiki

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'wiki/**'
      - '.github/workflows/wiki-sync.yml'

permissions:
  contents: write

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push wiki pages
        env:
          WIKI_REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          TMP=$(mktemp -d)
          if git clone "$WIKI_REMOTE" "$TMP" 2>/dev/null; then
            echo "Wiki repo exists — updating"
          else
            echo "Initializing wiki repo"
            git init "$TMP"
            cd "$TMP"
            git remote add origin "$WIKI_REMOTE"
            cd -
          fi

          rsync -av --delete --exclude README.md ./wiki/ "$TMP/"
          cd "$TMP"
          git add -A
          if git diff --staged --quiet; then
            echo "Wiki already up to date"
            exit 0
          fi
          git commit -m "docs(wiki): sync from ${{ github.sha }}"
          git branch -M master
          git push -u origin master
